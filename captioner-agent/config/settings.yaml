# Settings for the captioner agent. Relative paths are resolved against the
# captioner-agent directory (the parent of this config folder).

# Claude model and reasoning effort (low | medium | high | xhigh | max).
model: claude-opus-5-5
effort: medium
max_tokens: 32000
# If Claude declines a request on safety grounds, let the API retry it on a
# fallback model instead of stopping.
refusal_fallbacks: true

# Web server.
host: 127.0.0.1
port: 8000
max_upload_mb: 50

# Where uploads, captions and chat history are stored.
data_dir: data
# The caption rules given to Claude.
criteria_file: config/caption_criteria.md

# Captioning order is fixed: PNG info first, then a vision model only for
# images that have no PNG info. Who that vision model is:
#   ask:    the chat asks you each time, BLIP or Anthropic (recommended).
#   blip:   always BLIP on your GPU; the image stays on this machine.
#   claude: always Claude through the Anthropic API; the image is sent to Anthropic.
#   local:  always Florence-2 on your GPU; the image stays on this machine.
# The last three never ask. Whichever you use, after captioning the chat offers
# to enhance the captions with Anthropic or to re-caption them with BLIP.
vision_backend: ask
# How many images are captioned at the same time.
vision_concurrency: 4
# Caption length when vision_backend is blip or local: short | detailed | more_detailed
caption_style: detailed

# The image-captioner MCP server.
mcp:
  # stdio: the agent starts the server itself.
  # http:  the agent connects to a server that is already running at `url`.
  transport: stdio
  # Leave command empty to run the server with this Python interpreter.
  command: ""
  args: []
  url: http://127.0.0.1:8765/mcp
  # Extra environment for the server when transport is stdio.
  # See image-captioner-mcp/README.md for the full list.
  env:
    CAPTIONER_MODEL_ID: microsoft/Florence-2-large
    CAPTIONER_DEVICE: auto
