line-length = 110
target-version = "py310"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001"]  # captions and UI strings use typographic characters on purpose

[lint.per-file-ignores]
"**/tests/*" = ["E501"]  # literal tool calls and expected values read better on one line

[lint.isort]
known-first-party = ["captioner_agent", "image_captioner_mcp"]
