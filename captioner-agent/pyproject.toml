[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "captioner-agent"
version = "0.1.0"
description = "Web chat agent that captions images through the image-captioner MCP server."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "mcp>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "jsonschema>=4.20",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.10", "types-PyYAML", "types-jsonschema"]

[project.scripts]
captioner-agent = "captioner_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/captioner_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
files = ["src"]
