# Settings for the captioner agent. Relative paths are resolved against the
# captioner-agent directory (the parent of this config folder).

# Claude model and reasoning effort (low | medium | high | xhigh | max).
model: claude-opus-5-5
effort: medium
max_tokens: 32000
# If Claude declines a request on safety grounds, let the API retry it on a
# fallback model instead of stopping.
refusal_fallbacks: true

# Manual captioning: when a message comes with images, a small model checks
# whether you are writing the captions yourself ("image1 is a red car") or asking
# to. If so, the automatic steps are skipped and your captions are saved as
# written by the MANUAL_CAPTION tool. This is one cheap extra request per message
# that has both images and text; turn it off to always caption automatically.
detect_manual_captioning: true
router_model: claude-haiku-5-5

# Gemini as an optional backend for CLEANUP_AND_ENHANCE: from one prompt it removes
# overlaid text with its bubbles, bars and boxes, fills them in and returns a
# high-resolution image. OFF by default because it sends images to Google (and is
# billed per image). When on, and GEMINI_API_KEY is set, the chat asks you,
# "Local or Gemini?", before every cleanup request; nothing is sent until you pick Gemini.
gemini_cleanup: true
# A Gemini image model. gemini-2.5-flash-image declined to remove watermarks in testing.
gemini_model: gemini-3-pro-image-preview
# If Gemini returns a smaller image than asked for: keep Gemini's own pixels (none,
# sharpest), upscale them with the local model (local, softer) or resize them (resize).
gemini_upscale_fallback: none
# The size Gemini is asked for: 1K, 2K or 4K. The prompt, not the size, drives quality;
# 4K is slower and costs more.
gemini_image_size: 2K
# The prompt Gemini gets. Edit it to change what is removed and how the result
# should look; changes apply to the next cleanup without a restart.
gemini_prompt_file: config/gemini_cleanup_prompt.md

# Web server.
host: 127.0.0.1
port: 8000
max_upload_mb: 50

# Where uploads, captions and chat history are stored.
data_dir: data
# The caption rules given to Claude.
criteria_file: config/caption_criteria.md

# Captioning order is fixed: PNG info first, then a vision model only for
# images that have no PNG info. Who that vision model is:
#   ask:    the chat asks you each time, BLIP or Anthropic (recommended).
#   blip:   always BLIP on your GPU; the image stays on this machine.
#   claude: always Claude through the Anthropic API; the image is sent to Anthropic.
#   local:  always Florence-2 on your GPU; the image stays on this machine.
# The last three never ask. Whichever you use, after captioning the chat offers
# to enhance the captions with Anthropic or to re-caption them with BLIP.
vision_backend: ask
# How many images are captioned at the same time.
vision_concurrency: 4
# Caption length when vision_backend is blip or local: short | detailed | more_detailed
caption_style: detailed

# The image-captioner MCP server.
mcp:
  # stdio: the agent starts the server itself.
  # http:  the agent connects to a server that is already running at `url`.
  transport: stdio
  # Leave command empty to run the server with this Python interpreter.
  command: ""
  args: []
  url: http://127.0.0.1:8765/mcp
  # Extra environment for the server when transport is stdio.
  # See image-captioner-mcp/README.md for the full list.
  env:
    CAPTIONER_MODEL_ID: microsoft/Florence-2-large
    CAPTIONER_DEVICE: auto
